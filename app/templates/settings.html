{% extends "base.html" %}

{% block page_title %}Settings{% endblock %}

{% block content %}
<div style="max-width: 600px;">

  <form method="post">
    <div class="card mb-2">
      <h3 style="font-size:14px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:16px;">Business info</h3>
      <div class="form-group">
        <label for="business_name">Business name</label>
        <input type="text" id="business_name" name="business_name" class="input"
               value="{{ settings.business_name | e }}">
      </div>
      <div class="form-group">
        <label for="business_address">Address</label>
        <textarea id="business_address" name="business_address" class="input" rows="2">{{ settings.business_address | e }}</textarea>
      </div>
      <div class="form-group">
        <label for="business_phone">Phone</label>
        <input type="text" id="business_phone" name="business_phone" class="input"
               value="{{ settings.business_phone | e }}">
      </div>
    </div>

    <div class="card mb-2">
      <h3 style="font-size:14px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:16px;">Number series</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div class="form-group">
          <label for="invoice_prefix">Invoice prefix</label>
          <input type="text" id="invoice_prefix" name="invoice_prefix" class="input" value="{{ settings.invoice_prefix | e }}">
        </div>
        <div class="form-group">
          <label for="invoice_next">Next number</label>
          <input type="number" id="invoice_next" name="invoice_next" class="input" min="1" value="{{ settings.invoice_next | e }}">
        </div>
        <div class="form-group">
          <label for="po_prefix">PO prefix</label>
          <input type="text" id="po_prefix" name="po_prefix" class="input" value="{{ settings.po_prefix | e }}">
        </div>
        <div class="form-group">
          <label for="po_next">Next number</label>
          <input type="number" id="po_next" name="po_next" class="input" min="1" value="{{ settings.po_next | e }}">
        </div>
        <div class="form-group">
          <label for="quotation_prefix">Quotation prefix</label>
          <input type="text" id="quotation_prefix" name="quotation_prefix" class="input" value="{{ settings.quotation_prefix | e }}">
        </div>
        <div class="form-group">
          <label for="quotation_next">Next number</label>
          <input type="number" id="quotation_next" name="quotation_next" class="input" min="1" value="{{ settings.quotation_next | e }}">
        </div>
      </div>
    </div>

    <div class="card mb-2">
      <h3 style="font-size:14px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:16px;">Stock defaults</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div class="form-group">
          <label for="low_stock_default">Default reorder level (kg)</label>
          <input type="number" id="low_stock_default" name="low_stock_default" class="input" min="0" step="0.001" value="{{ settings.low_stock_default | e }}">
        </div>
        <div class="form-group">
          <label for="allow_negative_stock">Allow negative stock</label>
          <select id="allow_negative_stock" name="allow_negative_stock" class="input">
            <option value="0" {{ 'selected' if settings.allow_negative_stock == '0' }}>No – warn and require override</option>
            <option value="1" {{ 'selected' if settings.allow_negative_stock == '1' }}>Yes – allow by default</option>
          </select>
        </div>
        <div class="form-group">
          <label for="backup_retention">Keep last N backups</label>
          <input type="number" id="backup_retention" name="backup_retention" class="input" min="1" max="365" value="{{ settings.backup_retention | e }}">
        </div>
      </div>
    </div>

    <div style="display:flex;justify-content:flex-end;">
      <button type="submit" class="btn btn-primary">Save settings</button>
    </div>
  </form>

  <div class="card mt-2">
    <h3 style="font-size:14px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px;">Data folder</h3>
    <p class="text-sm text-muted mb-1">{{ data_folder_path }}</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;">
      <form method="post" action="{{ url_for('setup.open_another') }}">
        <button type="submit" class="btn btn-secondary">Open another data folder</button>
      </form>
      <form method="post" action="{{ url_for('main.shutdown') }}"
            onsubmit="return confirm('This will close Beads Manager. You can safely remove the pendrive after.')">
        <button type="submit" class="btn btn-danger">Close &amp; safe to remove pendrive</button>
      </form>
    </div>
  </div>

</div>
{% endblock %}
